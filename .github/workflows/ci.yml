name: CI

on:
  push:
    branches:
      - main
      - trading-bot-v2
  pull_request:
    branches:
      - main
      - trading-bot-v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_XMLDOC_MODE: skip

jobs:
  build-and-test:
    name: Build and test (.NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Show SDK information
        run: dotnet --info

      - name: Restore
        run: dotnet restore TradingBot.sln

      - name: Build
        run: dotnet build TradingBot.sln --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test
        run: >-
          dotnet test TradingBot.Tests/TradingBot.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=test-results.trx"
          --collect "XPlat Code Coverage"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: TestResults/**/*
          if-no-files-found: ignore
          retention-days: 14
