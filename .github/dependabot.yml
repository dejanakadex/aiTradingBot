version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Zagreb
    open-pull-requests-limit: 5
    target-branch: trading-bot-v2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Zagreb
    open-pull-requests-limit: 3
    target-branch: trading-bot-v2
